name: Personal Cloud Mac GUI

on:
  workflow_dispatch: # Start manually with 1 click
  repository_dispatch:
    types: [renew-mac] # Auto-triggered before the 6-hour timer expires

jobs:
  start-mac-desktop:
    runs-on: macos-latest # Apple Silicon M-series (3 CPU, 14GB RAM, Free on Public Repo)
    timeout-minutes: 360  # Maximum 6-hour session per run

    steps:
      - name: 1. Restore Your Personal Files (From Previous Session)
        uses: actions/cache/restore@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}
          restore-keys: |
            personal-mac-files-

      - name: 2. Configure macOS Desktop & Enable Screen Sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          # Create your persistent folder on the Desktop
          mkdir -p ~/Desktop/MyFiles

          # Set the macOS 'runner' account password to your VNC_PASSWORD
          sudo sysadminctl -resetPasswordFor runner -newPassword "$VNC_PASSWORD" || \
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD"

          # Stop macOS from sleeping or locking the screen
          defaults write com.apple.screensaver idleTime 0
          sudo pmset -a displaysleep 0 sleep 0

          # Set legacy VNC password hash in macOS preferences
          perl -we 'BEGIN { @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA"}; $_ = <>; chomp; s/^(.{8}).*/$1/; @p = unpack "C*", $_; foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }; print "\n"' <<< "$VNC_PASSWORD" | sudo tee /Library/Preferences/com.apple.VNCSettings.txt > /dev/null
          sudo chown root:wheel /Library/Preferences/com.apple.VNCSettings.txt
          sudo chmod 400 /Library/Preferences/com.apple.VNCSettings.txt

          # Turn on macOS VNC Server
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -restart -agent -console

      - name: 3. Start Browser GUI Tunnel (Click Link Here!)
        run: |
          brew install cloudflared novnc

          # Connect macOS VNC (5900) to Web Browser Port (6080)
          /opt/homebrew/opt/novnc/bin/novnc_proxy --vnc localhost:5900 --listen 6080 > novnc.log 2>&1 &

          # Generate free HTTPS Cloudflare link
          cloudflared tunnel --url http://localhost:6080 > cf.log 2>&1 &

          sleep 10
          GUI_URL=$(grep -o "https://[-a-z0-9.]*\.trycloudflare\.com" cf.log | head -n 1)

          echo "========================================================================"
          echo "🖥️ YOUR PERSONAL MAC DESKTOP IS READY!"
          echo "🌐 Open in Chrome/Edge/Brave: ${GUI_URL}/vnc.html?autoconnect=true"
          echo "👤 macOS Username          : runner"
          echo "🔑 Password                : (Your VNC_PASSWORD Secret)"
          echo "📁 Save permanent files in : Desktop -> MyFiles folder"
          echo "========================================================================"

      - name: 4. Keep Mac Running (5 Hours 30 Minutes per Cycle)
        run: |
          echo "Your Mac is now live. Do not cancel this step while using the desktop."
          echo "To gracefully shut down and save your files early, run: touch ~/stop-mac"
          # Loops every 15 seconds for up to 5.5 hours (19800s) or until ~/stop-mac is created
          SECONDS_ELAPSED=0
          while [ $SECONDS_ELAPSED -lt 19800 ]; do
            if [ -f ~/stop-mac ]; then
              echo "Manual shutdown signal detected! Saving files now..."
              break
            fi
            sleep 15
            SECONDS_ELAPSED=$((SECONDS_ELAPSED + 15))
          done

      - name: 5. Save Your Personal Files for Next Session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}

      - name: 6. Auto-Spawn Next 6-Hour Mac Session
        if: always() && vars.AUTO_RENEW == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Starting fresh 6-hour Mac session automatically..."
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"renew-mac"}'
