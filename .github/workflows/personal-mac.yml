name: Personal Cloud Mac GUI

on:
  workflow_dispatch:
  repository_dispatch:
    types: [renew-mac]

jobs:
  start-mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 1. Restore Your Personal Files
        uses: actions/cache/restore@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}
          restore-keys: |
            personal-mac-files-

      - name: 2. Start macOS GUI & Tunnel (Copy URL from Here!)
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          mkdir -p ~/Desktop/MyFiles

          # 1. Disable sleep and screen lock
          defaults write com.apple.screensaver idleTime 0
          sudo pmset -a displaysleep 0 sleep 0

          # 2. Change the macOS 'runner' user password to your VNC_PASSWORD secret
          sudo sysadminctl -resetPasswordFor runner -newPassword "$VNC_PASSWORD" || \
          sudo dscl . -passwd /Users/runner "$VNC_PASSWORD"

          # 3. Enable Apple's Built-in Screen Sharing Server (Port 5900)
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -allUsers -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "$VNC_PASSWORD" \
            -restart -agent -console

          # 4. Install cloudflared & expose macOS VNC port 5900 directly
          brew install cloudflared
          cloudflared tunnel --url tcp://localhost:5900 > cf.log 2>&1 &

          for i in {1..25}; do
            TUNNEL_HOST=$(grep -o "[-a-z0-9.]*\.trycloudflare\.com" cf.log | head -n 1 || true)
            if [ -n "$TUNNEL_HOST" ]; then
              break
            fi
            sleep 1
          done

          echo "========================================================================"
          echo "🖥️ YOUR MAC DESKTOP IS LIVE!"
          echo "1️⃣ Run this command in your Linux Mint Terminal:"
          echo "   cloudflared access tcp --hostname ${TUNNEL_HOST} --url localhost:5900"
          echo ""
          echo "2️⃣ Open Remmina on Linux Mint, choose VNC, and connect to:"
          echo "   localhost:5900"
          echo "   Username: runner"
          echo "   Password: (Your VNC_PASSWORD secret)"
          echo "========================================================================"

          # Keep Mac alive for 5.5 hours
          SECONDS_ELAPSED=0
          while [ $SECONDS_ELAPSED -lt 19800 ]; do
            if [ -f ~/stop-mac ]; then
              break
            fi
            sleep 15
            SECONDS_ELAPSED=$((SECONDS_ELAPSED + 15))
          done

      - name: 3. Save Your Personal Files for Next Session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}

      - name: 4. Auto-Spawn Next 6-Hour Mac Session
        if: always() && vars.AUTO_RENEW == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"renew-mac"}'
