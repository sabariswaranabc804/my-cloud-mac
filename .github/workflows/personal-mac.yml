name: Personal Cloud Mac GUI

on:
  workflow_dispatch:
  repository_dispatch:
    types: [renew-mac]

jobs:
  start-mac-desktop:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: 1. Restore Your Personal Files
        uses: actions/cache/restore@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}
          restore-keys: |
            personal-mac-files-

      - name: 2. Start 1-Click Browser Mac GUI (With -rfbnoauth)
        run: |
          mkdir -p ~/Desktop/MyFiles

          # 1. Disable sleep and screen lock
          defaults write com.apple.screensaver idleTime 0
          sudo pmset -a displaysleep 0 sleep 0

          # 2. Install Rosetta 2 & cloudflared
          sudo softwareupdate --install-rosetta --agree-to-license || true
          brew install cloudflared

          # 3. Download and install Vine Server (OSXvnc)
          curl -sL https://github.com/stweil/OSXvnc/releases/download/V5_3_1/VineServer-5.3.1.dmg -o VineServer.dmg
          hdiutil attach VineServer.dmg -mountpoint /Volumes/VineServer -nobrowse
          sudo cp -R "/Volumes/VineServer/Vine Server.app" /Applications/
          hdiutil detach /Volumes/VineServer
          sudo xattr -rd com.apple.quarantine "/Applications/Vine Server.app" || true

          VNC_BIN=$(find "/Applications/Vine Server.app" -name "OSXvnc-server" -type f | head -n 1)

          # 4. Launch OSXvnc-server on port 5901 WITH -rfbnoauth
          USER_UID=$(id -u runner)
          sudo launchctl asuser "$USER_UID" "$VNC_BIN" \
            -rfbport 5901 \
            -rfbnoauth \
            -desktop "Personal-Cloud-Mac" \
            -alwaysshared \
            -dontdisconnect > /Users/runner/osxvnc.log 2>&1 &

          sleep 5
          echo "--- OSXvnc Startup Log ---"
          cat /Users/runner/osxvnc.log || true
          echo "--- Verifying Port 5901 is Listening ---"
          sudo lsof -i :5901

          # 5. Start noVNC + websockify connected to 127.0.0.1:5901
          git clone --depth 1 https://github.com/novnc/noVNC.git ~/noVNC
          git clone --depth 1 https://github.com/novnc/websockify.git ~/noVNC/utils/websockify

          ~/noVNC/utils/novnc_proxy --vnc 127.0.0.1:5901 --listen 6080 > novnc.log 2>&1 &
          sleep 3
          cat novnc.log || true

          # 6. Start Cloudflare Tunnel using HTTP/2
          cloudflared tunnel --protocol http2 --url http://127.0.0.1:6080 > cf.log 2>&1 &

          for i in {1..25}; do
            GUI_URL=$(grep -o "https://[-a-z0-9.]*\.trycloudflare\.com" cf.log | head -n 1 || true)
            if [ -n "$GUI_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "========================================================================"
          echo "🖥️ CLICK THIS LINK IN FIREFOX OR CHROME:"
          echo "👉 ${GUI_URL}/vnc.html?autoconnect=true&resize=scale"
          echo "📁 Save permanent files in: Desktop -> MyFiles folder"
          echo "========================================================================"

          # 7. Keep Mac alive for 5.5 hours
          SECONDS_ELAPSED=0
          while [ $SECONDS_ELAPSED -lt 19800 ]; do
            if [ -f ~/stop-mac ]; then
              echo "Manual shutdown signal detected! Saving files now..."
              break
            fi
            sleep 15
            SECONDS_ELAPSED=$((SECONDS_ELAPSED + 15))
          done

      - name: 3. Save Your Personal Files for Next Session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Desktop/MyFiles
          key: personal-mac-files-${{ github.run_id }}

      - name: 4. Auto-Spawn Next 6-Hour Mac Session
        if: always() && vars.AUTO_RENEW == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_PAT" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"renew-mac"}'
